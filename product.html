<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<title>পণ্যের বিস্তারিত | One X Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@800&display=swap" rel="stylesheet">
<style>
:root{--ink:#05050a;--line:rgba(255,255,255,.12);--text:#f4f3ff;--muted:#a9a7c4;--green:#2ee59d;--amber:#ffb020;--red:#ff5c7a;
--gm:linear-gradient(120deg,#7c5cff,#ff3d81 55%,#ffb020);--gc:linear-gradient(120deg,#00d4ff,#7c5cff)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hind Siliguri',sans-serif;background:var(--ink);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.55;padding-bottom:110px}
.bg{position:fixed;inset:0;z-index:-1;background:
radial-gradient(circle at 10% 0,rgba(124,92,255,.35),transparent 45%),
radial-gradient(circle at 100% 60%,rgba(255,61,129,.26),transparent 45%),
radial-gradient(circle at 0 100%,rgba(0,212,255,.2),transparent 45%),
repeating-linear-gradient(115deg,transparent 0 118px,rgba(255,255,255,.04) 118px 120px),var(--ink)}
.top{position:sticky;top:0;z-index:20;background:rgba(5,5,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.back{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);font-family:inherit;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer;text-decoration:none;font-size:.9rem}
.brand{font-family:'Noto Serif Bengali',serif;font-weight:800;font-size:1.1rem;background:var(--gm);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.slwrap{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#14142a}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slider::-webkit-scrollbar{display:none}
.slider img{flex:none;width:100%;aspect-ratio:1/1;object-fit:contain;background:#0c0c18;scroll-snap-align:center}
.cnt{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.65);padding:3px 12px;border-radius:99px;font-size:.8rem;font-weight:600}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:.2s}
.dots i.on{width:22px;border-radius:99px;background:var(--gm)}
.card{background:rgba(14,14,28,.85);border:1px solid var(--line);border-radius:22px;padding:18px 16px;margin-top:14px}
h1{font-size:1.4rem;line-height:1.35;margin-bottom:8px}
.pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.now{font-size:1.7rem;font-weight:700;background:var(--gc);-webkit-background-clip:text;background-clip:text;color:transparent}
.old{color:var(--muted);text-decoration:line-through}
.off{background:var(--gm);padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.stock{margin-top:6px;font-weight:600;font-size:.95rem;color:var(--green)}
.stock.low{color:var(--amber)}.stock.zero{color:var(--red)}
h3{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:4px;height:18px;border-radius:3px;background:var(--gm);transform:skewX(-14deg)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-family:inherit;font-size:.98rem;font-weight:600;padding:8px 18px;border-radius:14px;cursor:pointer}
.chip.on{border-color:transparent;background:var(--gc);color:#fff}
.sec{margin-top:16px}
.desc{white-space:pre-wrap;word-break:break-word;color:#dcdaf0}
.vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(5,5,10,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .p{font-size:1.35rem;font-weight:700;white-space:nowrap}
.buy{flex:1;border:0;cursor:pointer;color:#fff;font-family:inherit;font-size:1.1rem;font-weight:700;padding:14px;border-radius:16px;background:var(--gm);box-shadow:0 12px 28px -10px rgba(255,61,129,.7)}
.buy:disabled{opacity:.5;box-shadow:none}
.empty{text-align:center;color:var(--muted);padding:60px 16px}
.empty a{color:#fff;font-weight:700}
.sk{height:380px;border-radius:24px;background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 70%);background-size:300% 100%;animation:s 1.4s linear infinite}
@keyframes s{to{background-position:-300% 0}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="top"><div class="in"><a class="back" href="index.html">← হোম</a><span class="brand">One X Mart</span></div></div>
<main class="wrap" id="app"><div class="sk"></div></main>
<div class="bar hidden" id="bar" style="display:none"><div class="in"><div class="p" id="barPrice"></div><button class="buy" id="buyBtn" type="button">অর্ডার করুন</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const db = getDatabase(initializeApp({
  apiKey: "AIzaSyAoQiTua4EcGnxAl3qs7056WMwehd4qQgc",
  authDomain: "one-x-mart.firebaseapp.com",
  databaseURL: "https://one-x-mart-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "one-x-mart",
  storageBucket: "one-x-mart.firebasestorage.app",
  messagingSenderId: "451753691167",
  appId: "1:451753691167:web:e72bf1c201e538dc052d2a"
}));

const $ = (s) => document.querySelector(s);
const bn = (n) => Number(n || 0).toLocaleString("bn-BD");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const big = (u, w) => (u && u.includes("res.cloudinary.com") && u.includes("/upload/")) ? u.replace("/upload/", "/upload/f_auto,q_auto:best,w_" + w + ",c_limit/") : u;
const ytId = (u) => { const m = String(u || "").match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/); return m ? m[1] : null; };

const id = new URLSearchParams(location.search).get("id");
let p = null, size = "", color = "";

function fail(msg) {
  $("#app").innerHTML = '<div class="empty"><p>' + esc(msg || "পণ্যটি খুঁজে পাওয়া যায়নি।") + '</p><p style="margin-top:12px"><a href="index.html">← হোম পেজে ফিরুন</a></p></div>';
}

function chips(boxId, list, cur, set) {
  const box = $(boxId);
  box.innerHTML = "";
  list.forEach((v) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (v === cur ? " on" : "");
    b.textContent = v;
    b.addEventListener("click", () => { set(v === cur ? "" : v); drawChips(); });
    box.appendChild(b);
  });
}
function drawChips() {
  if (p.colors && p.colors.length) chips("#colors", p.colors, color, (v) => (color = v));
  if (p.sizes && p.sizes.length) chips("#sizes", p.sizes, size, (v) => (size = v));
}

function render() {
  document.title = (p.name || "পণ্য") + " | One X Mart";
  const imgs = (p.images && p.images.length ? p.images : [p.image]).filter(Boolean);
  const stock = Number(p.stock);
  const out = p.stock !== undefined && stock <= 0;
  const off = p.oldPrice && Number(p.oldPrice) > Number(p.price) ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
  const vid = ytId(p.videoUrl);

  $("#app").innerHTML =
    '<div class="slwrap"><div class="slider" id="sl">' +
      imgs.map((u) => '<img src="' + esc(big(u, 1200)) + '" alt="' + esc(p.name) + '" decoding="async">').join("") +
    '</div>' + (imgs.length > 1 ? '<span class="cnt" id="cnt">১/' + bn(imgs.length) + '</span>' : "") + '</div>' +
    (imgs.length > 1 ? '<div class="dots" id="dots">' + imgs.map((_, i) => '<i class="' + (i ? "" : "on") + '"></i>').join("") + '</div>' : "") +
    '<div class="card"><h1>' + esc(p.name) + '</h1>' +
      '<div class="pr"><span class="now">৳' + bn(p.price) + '</span>' +
      (off ? '<span class="old">৳' + bn(p.oldPrice) + '</span><span class="off">' + bn(off) + '% ছাড়</span>' : "") + '</div>' +
      '<div class="stock ' + (out ? "zero" : stock <= 5 ? "low" : "") + '">' +
        (p.stock === undefined ? "" : out ? "স্টক শেষ" : stock <= 5 ? "মাত্র " + bn(stock) + "টি বাকি আছে!" : "স্টকে আছে: " + bn(stock) + "টি") +
      '</div>' +
      (p.colors && p.colors.length ? '<div class="sec"><h3>কালার সিলেক্ট করুন</h3><div class="chips" id="colors"></div></div>' : "") +
      (p.sizes && p.sizes.length ? '<div class="sec"><h3>সাইজ সিলেক্ট করুন</h3><div class="chips" id="sizes"></div></div>' : "") +
    '</div>' +
    (p.description ? '<div class="card"><h3>পণ্যের বিস্তারিত</h3><p class="desc">' + esc(p.description) + '</p></div>' : "") +
    (vid ? '<div class="card"><h3>পণ্যের ভিডিও</h3><div class="vid"><iframe src="https://www.youtube.com/embed/' + vid + '" title="পণ্যের ভিডিও" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div>' : "");

  drawChips();

  const sl = $("#sl");
  if (imgs.length > 1) {
    sl.addEventListener("scroll", () => {
      const i = Math.round(sl.scrollLeft / sl.clientWidth);
      $("#cnt").textContent = bn(i + 1) + "/" + bn(imgs.length);
      document.querySelectorAll("#dots i").forEach((d, k) => d.classList.toggle("on", k === i));
    }, { passive: true });
  }

  $("#barPrice").textContent = "৳" + bn(p.price);
  $("#bar").style.display = "block";
  const btn = $("#buyBtn");
  btn.disabled = out;
  btn.textContent = out ? "স্টক শেষ" : "অর্ডার করুন";
  btn.addEventListener("click", () => {
    const q = new URLSearchParams({ id });
    if (size) q.set("size", size);
    if (color) q.set("color", color);
    location.href = "order.html?" + q.toString();
  });
}

(async () => {
  if (!id) return fail();
  try {
    p = (await get(ref(db, "products/" + id))).val();
  } catch (e) { return fail("পণ্য লোড করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।"); }
  if (!p || p.published === false) return fail();
  render();
})();
</script>
</body>
</html>
